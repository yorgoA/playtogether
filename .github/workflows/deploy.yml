name: Deploy
# Staging gets main once CI has passed on it. Production only changes by hand:
# Actions → Deploy → Run workflow, on main. Until the Cloudflare secrets are set, it only says so.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'staging' }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set yet, so nothing was deployed."
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          # After CI, the commit CI checked, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      # The Cloudflare Vite plugin writes the deploy config for CLOUDFLARE_ENV. Production is the top level of wrangler.jsonc.
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = staging ]; then export CLOUDFLARE_ENV=staging; fi
          npm run build
      # Before the new code goes live, so it never runs against an older schema.
      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = staging ]; then
            npx wrangler d1 migrations apply DB --remote --env staging
          else
            npx wrangler d1 migrations apply DB --remote
          fi
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
