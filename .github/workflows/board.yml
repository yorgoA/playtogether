name: Board
# Keeps the project board's Status in step where GitHub's built-in workflows cannot. See .github/scripts/board.mjs.
on:
  # pull_request_target runs this file from main, never the pull request's code, so the token stays safe.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft]
  issues:
    types: [opened, closed, reopened]
  # GitHub sends no event when a "blocked by" link is added, so check every hour too.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: board
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/board.mjs
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          BOARD_OWNER: yorgoA
          BOARD_NUMBER: 1
