name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Find unused files, exports and dependencies
        run: npm run knip
      - name: Check the schema and migrations agree
        run: npm run db:verify
      - name: Run the tests, with back-end coverage floors
        run: npm run test:coverage
      - name: Show the coverage in the run summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const rows = ['lines', 'branches', 'functions', 'statements'].map((k) => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + ' / ' + t[k].total + ' |');
            console.log(['### Back-end coverage', '', '| | Covered | |', '| --- | --- | --- |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Check the Worker stays under the Workers Free size limit
        run: npm run size
